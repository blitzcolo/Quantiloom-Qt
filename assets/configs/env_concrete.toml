# ============================================================================
# Quantiloom - Environment: Concrete pad (水泥地)
# ============================================================================
# Flat concrete test pad with 2 m expansion joints, urban haze atmosphere.
#
# Geometry: scripts/gen_env_scenes.py builds the GLB -- procedural terrain and
# textures merged with SU7 (5.0 m), CesiumMan (1.76 m) and the glass/chrome
# look-dev sphere pair, all at real-world scale (1 unit = 1 m).
#
# Spectral: the ground and building materials are bound to measured USGS
# splib07a curves (VIS/NIR/SWIR coverage 1.00 on every one); metals and glass
# carry measured n(lambda), k(lambda) instead. Several are bound to a mixture
# of curves rather than one, which is what keeps their texture in the spectral
# modes. Verify a candidate curve with
#     python3 scripts/spectral_preview.py usgs "<ref>"
# ============================================================================

[renderer]
resolution = [1600, 900]
spp = 64
seed = 42
output = "env_concrete.exr"
# Lighting is the sun + NN atmosphere sky; keep the IBL off so the two are not
# counted twice.
environment_map = ""
environment_map_enabled = false

[spectral]
# "rgb" is the fast preview and the default. "vis_fused" integrates 32
# wavelengths against the measured curves below and is the physically correct
# path; switching is this one line, everything else is already in place.
#
# One thing changes with it: it renders in absolute W*m^-2*nm^-1, so the frame
# is dimmer than the rgb preview and the sky is the ASTM diffuse component
# alone.
#
# The textures survive. A material bound to several measured curves renders as
# a mixture of them, and how much of each is where is unmixed from its own
# base-colour texture at load -- the spectra stay exactly as measured, and the
# texture decides the proportions. With one curve that reduces to brightness
# modulation of that curve. Set spectral_unmix = "off" on a material to get the
# old flat behaviour back.
#
# The render log reports each mixture's split, e.g. "endmember split 48% / 52%".
# Read it: an endmember can only pick up weight where the texture shows its
# colour, and endmembers that differ only in brightness are not separable at
# all -- any of them, scaled, makes the same colour. The procedural textures
# these scenes ship with are near-uniform in hue, so most mixtures below
# currently land on one endmember and read 100% / 0%. They are written as
# mixtures because that is what the surface physically is, and because
# dropping in a photographic texture makes them split without touching this
# file. The beach, whose texture already varies wet to dry, splits today.
mode = "rgb"
band = "VIS"
# NMF basis + material index. BOTH are required for any quantiloom_* binding;
# naming only one silently disables all of them.
basis_file = "../spectral/quantiloom_basis_v3_usgs.qlbin"
materials_json = "../spectral/quantiloom_materials_usgs.json"

[scene]
gltf = "../models/env/concrete.glb"
world_units_to_meters = 1.0
default_temperature_k = 303.0

[camera]
position = [6.5, 1.7, 9.0]
look_at = [0.0, 1.0, 0.0]
up = [0.0, 1.0, 0.0]
fov_y = 45.0

[lighting]
# ~52 deg elevation from the south-west.
sun_direction = [-0.45, 0.79, 0.42]
sun_radiance = [3.1, 3.05, 2.95]
sky_radiance = [0.45, 0.55, 0.75]   # RGB mode only; the spectral modes read the LUT

# ASTM G-173 solar spectrum. A spectral mode with a non-zero sun is REFUSED by
# the CLI without this -- the sun's spectrum is user data like a reflectance
# curve, and an absent LUT renders black rather than inventing one. Column 4 is
# direct+circumsolar, column 3 is global tilt, and global tilt already contains
# the direct beam, hence diffuse_is_global.
solar_lut = "../luts/astmg173.csv"
solar_lut_columns = [4, 3]
solar_lut_diffuse_is_global = true
# Left in absolute W*m^-2*nm^-1 as published. `solar_lut_normalise =
# "unit_luminance"` divides by the sun's own luminance, which on this LUT is a
# large number -- it takes the frame several stops DOWN, not to a neutral
# exposure. It is not an exposure control.

[atmosphere]
preset = "urban_haze"         # vis 8 km, warmer, hazier city air
t_ground_K = 303.15

[material]
albedo = [0.8, 0.8, 0.8]

# ============================================================================
# Measured spectral reflectance (USGS splib07a, reconstructed from the NMF basis)
# ============================================================================
# Each ref is the exact key in quantiloom_materials_usgs.json. A ref that does
# not match falls back to RGB upsampling with only a warning, so keep the
# strings verbatim -- including the punctuation.
#
# Deliberately NOT bound:
#   - GlassSphere / WindowGlass / Car_Car_window: transmissive. Their physics is
#     the measured n(lambda) below plus Fresnel; a library "reflectance" here
#     would double count the surface term.
#   - the CesiumMan figure: none of the three databases has skin, and its
#     texture is a stylised decal, so it stays RGB-upsampled on purpose.
# ============================================================================

[[materials]]
name = "ConcreteGround"
spectral_material_type = "quantiloom_usgs"
# Weathered road concrete and clean concrete, plus the tyre-black that
# collects on a working pad. Three endmembers, so the joints and the traffic
# lanes carry different measured spectra rather than one average.
spectral_material_refs = [
    "Concrete GDS375 Lt Gry Road",   # the slab itself, rho ~ 0.27
    "Asphalt GDS376 Blck_Road old",  # tyre rubber and oil, rho ~ 0.09
]

# Road concrete. Thirty centimetres of slab is a quarter of a metre of
# thermal mass, which is why a pad is still warm hours after sunset and
# why it is the slowest surface in any of these scenes.
ir_emissivity = 0.93
thermal_conductivity_w_mk = 1.4
density_kg_m3 = 2300
specific_heat_j_kgk = 880
thickness_m = 0.3
convection_h_w_m2k = 12
shortwave_absorptivity = 0.6
wetness_factor = 0.02
interior_bc = "adiabatic"

[[materials]]
name = "ConcreteBlock"
spectral_material_type = "quantiloom_usgs"
spectral_material_ref = "Concrete GDS375 Lt Gry Road"
# One endmember on purpose, for comparison: this still unmixes, but against a
# single curve, which is brightness modulation of that one measurement.

# The same material, half the depth, and sheltered from the wind.
ir_emissivity = 0.93
thermal_conductivity_w_mk = 1.4
density_kg_m3 = 2300
specific_heat_j_kgk = 880
thickness_m = 0.2
convection_h_w_m2k = 10
shortwave_absorptivity = 0.6
interior_bc = "adiabatic"

[[materials]]
name = "HouseWall"
spectral_material_type = "quantiloom_usgs"
spectral_material_ref = "Titanium_dioxide GDS798 TiO2"   # the pigment in white wall paint

# Rendered masonry, painted white so it takes little of the sun, and held
# from behind by a room at 295 K. The fixed back face is what stops a
# wall following the night down the way an unbacked slab does.
ir_emissivity = 0.92
thermal_conductivity_w_mk = 0.8
density_kg_m3 = 1800
specific_heat_j_kgk = 900
thickness_m = 0.25
convection_h_w_m2k = 8
shortwave_absorptivity = 0.3
interior_bc = "fixed"
interior_temperature_k = 295

[[materials]]
name = "HouseRoof"
spectral_material_type = "quantiloom_usgs"
spectral_material_ref = "Brick GDS350 Dk Red Building"

# Dark tile, four centimetres of it, exposed to the wind and to the whole
# sky: the hottest surface in the scene by day and the coldest by night,
# which is what a thin skin facing the zenith does.
ir_emissivity = 0.93
thermal_conductivity_w_mk = 0.9
density_kg_m3 = 2000
specific_heat_j_kgk = 900
thickness_m = 0.04
convection_h_w_m2k = 15
shortwave_absorptivity = 0.75
interior_bc = "fixed"
interior_temperature_k = 298

[[materials]]
name = "HouseDoor"
spectral_material_type = "quantiloom_usgs"
spectral_material_ref = "Wood_Beam GDS363 Nw Pine 2X4"

# --- SU7 --------------------------------------------------------------------

# Pine. Light and insulating, so it warms faster than the wall it sits in.
ir_emissivity = 0.9
thermal_conductivity_w_mk = 0.15
density_kg_m3 = 600
specific_heat_j_kgk = 1600
thickness_m = 0.04
convection_h_w_m2k = 8
shortwave_absorptivity = 0.55
interior_bc = "fixed"
interior_temperature_k = 295

[[materials]]
name = "Car_Car_body"
spectral_material_type = "quantiloom_usgs"
spectral_material_ref = "Titanium_dioxide GDS798 TiO2"   # white automotive paint pigment

# Painted aluminium panel, 3 mm of skin and structure -- a thousandth of
# the ground's thermal mass, so it tracks the sun in minutes while the
# slab under it takes hours. Aluminium's real conductivity puts a very
# large Fourier number on eight nodes across three millimetres; it makes
# no difference, because a sheet this thin is isothermal through its
# depth either way (checked against k = 1.5: the same answer to a
# kelvin).
ir_emissivity = 0.92
thermal_conductivity_w_mk = 200
density_kg_m3 = 2700
specific_heat_j_kgk = 900
thickness_m = 0.003
convection_h_w_m2k = 10
shortwave_absorptivity = 0.35
interior_bc = "adiabatic"

[[materials]]
name = "Car_M_Wheel_ALL.002"
spectral_material_type = "quantiloom_usgs"
spectral_material_ref = "Carbon_Black GDS68"             # tyre carbon black

# Tyre rubber: nearly black to the sun and a poor conductor, so it runs
# hotter than the bodywork above it.
ir_emissivity = 0.95
thermal_conductivity_w_mk = 0.25
density_kg_m3 = 1100
specific_heat_j_kgk = 1900
thickness_m = 0.015
convection_h_w_m2k = 16
shortwave_absorptivity = 0.92
interior_bc = "adiabatic"

[[materials]]
name = "Car_M_BODY_black.004"
spectral_material_type = "quantiloom_usgs"
spectral_material_ref = "Plastic_ABS GDS341 BlackPipe"

# ============================================================================
# Measured complex refractive index (refractiveindex.info)
# ============================================================================
# Replaces the metallic/albedo guess for F0 with
# [(n-1)^2 + k^2] / [(n+1)^2 + k^2] evaluated per wavelength, and enables the
# dispersive hero-wavelength path on the dielectrics. Only "tabulated nk" and
# "tabulated n" files parse -- the Sellmeier "formula" entries that most of the
# RII glass catalogue uses do not, which is why the glass here is the measured
# NSG Opti-White float glass rather than a named optical crown.
# ============================================================================

# Black plastic trim, the hottest thing on the car.
ir_emissivity = 0.94
thermal_conductivity_w_mk = 0.2
density_kg_m3 = 1100
specific_heat_j_kgk = 1500
thickness_m = 0.006
convection_h_w_m2k = 16
shortwave_absorptivity = 0.9
interior_bc = "adiabatic"

# ============================================================================
# Infrared: what each surface radiates, and what sets its temperature
# ============================================================================
# ir_emissivity is what the long-wave render reads; without it the loader
# guesses from the metallic factor, which is right for metals and wrong for
# everything else.
#
# Naming a thermal_conductivity_w_mk is what opts a material into the surface
# energy balance below. A material without one keeps the temperature it is
# given -- [scene] default_temperature_k, or its own ir_temperature_k -- which
# is the right answer for glass, for polished metal, and for the person.
# ============================================================================

[[materials]]
name = "ChromeSphere"
# Polished chrome. Emissivity this low means a thermal camera reads the
# sky reflected in it rather than the sphere -- the classic way to get a
# thermogram wrong, and worth having in frame on purpose.
ir_emissivity = 0.1

[[materials]]
name = "GlassSphere"
# Glass is opaque and strongly emitting in the long wave, whatever it does
# in the visible. It is not solved: its physics here is the measured
# n(lambda) below.
ir_emissivity = 0.88

[[materials]]
name = "WindowGlass"
# As GlassSphere.
ir_emissivity = 0.88

[[materials]]
name = "Car_Car_window"
# As GlassSphere.
ir_emissivity = 0.88

[[materials]]
name = "Car_M_IRON.004"
# Bare aluminium, and as misleading in the infrared as the chrome.
ir_emissivity = 0.12

[[materials]]
name = "Man_Cesium_Man-effect"
# Skin, held at 307 K rather than solved: a person is a heat source with a
# blood supply, and the balance here has no term for either. A solved
# figure would cool to the ground's temperature, which is the one thing
# a person never does.
ir_emissivity = 0.98
ir_temperature_k = 307

# The rest of the car -- lamps, plates, interior trim seen through the
# glass. One emissivity each and no solve: they are small, they are
# mostly shaded, and none of them is what the scene is about.
[[materials]]
name = "Car_interior1.001"
ir_emissivity = 0.9

[[materials]]
name = "Car_interior2.001"
ir_emissivity = 0.9

[[materials]]
name = "Car_interior3.001"
ir_emissivity = 0.9

[[materials]]
name = "Car_interior4.001"
ir_emissivity = 0.9

[[materials]]
name = "Car_M_ChePai.004"
ir_emissivity = 0.9

[[materials]]
name = "Car_M_LOGO.004"
ir_emissivity = 0.9

[[materials]]
name = "Car_M_BODY_inside.004"
ir_emissivity = 0.9

[[materials]]
name = "Car_Car_backlight"
ir_emissivity = 0.9

[[materials]]
name = "Car_Car_lightglass"
ir_emissivity = 0.9

[[materials]]
name = "Car_Car_frontlight"
ir_emissivity = 0.9

[[materials]]
name = "Car_Car_radar"
ir_emissivity = 0.9

[[materials]]
name = "Car_pasted__M_BODY_inside.001"
ir_emissivity = 0.9

[refractive_index]
ChromeSphere = "D:/Quantiloom-dev/assets/refractiveindex/database/data/main/Cr/nk/Rakic-LD.yml"
"Car_M_IRON.004" = "D:/Quantiloom-dev/assets/refractiveindex/database/data/main/Al/nk/Rakic.yml"
# NSG Opti-White low-iron float glass, tabulated n,k over 301-1498 nm.
GlassSphere = "D:/Quantiloom-dev/assets/refractiveindex/database/data/glass/misc/Pilkington-Optiwhite/nk/Treharne.yml"
WindowGlass = "D:/Quantiloom-dev/assets/refractiveindex/database/data/glass/misc/Pilkington-Optiwhite/nk/Treharne.yml"
"Car_Car_window" = "D:/Quantiloom-dev/assets/refractiveindex/database/data/glass/misc/Pilkington-Optiwhite/nk/Treharne.yml"

# ============================================================================
# [thermal] -- the temperatures come from an energy balance, not from the file
# ============================================================================
# An urban pad at 14:00. The slab has been taking sun since morning
# and is the warmest thing in frame; the car, with a thousandth of its
# mass, is already following the sky instead.
#
# The forcing file is a day of weather, hour by hour, generated by
# scripts/gen_env_forcing.py from THIS scene's own [lighting] sun_direction: at
# 14.0 h the sun in that file points exactly where the scene is lit from,
# so the surface the solver warms is the surface the render shows lit. Move
# time_h and the shadows move with it -- that is the whole point of the file.
#
# Costs a view-factor precompute plus the stepping. In Studio that is the GPU
# stepper and a slider; from the CLI it is a minute or so of CPU. Set
# enabled = false to get the config's own temperatures back.
[thermal]
enabled = true
time_h = 14.0
start_time_h = 0.0
# 120 s, and the reason is worth knowing: the solver's own shortest-time-
# constant warning looks at each surface against a fixed background, which
# puts the fastest thing here -- the car's 3 mm panel -- at about 470 s. Once
# the view factors couple that panel to surfaces that are themselves moving,
# the explicit radiative term needs a good deal less than that. At 300 s this
# scene diverges outright; 120 s and 60 s agree to the kelvin, so 120 s is
# converged. Shorten it again if you add anything thinner than the panel.
timestep_s = 120.0
layers = 8
# Uniform rather than steady, and not by preference: the steady-state
# relaxation takes hour-long steps, which is far longer than the time
# constant of a 4 cm roof tile or a car panel, so on a scene carrying both
# it does not settle -- it diverges, and takes the run with it. Starting
# everything at the pre-dawn air temperature and stepping from midnight
# gets the thin surfaces to the right answer within the hour. The deep
# slabs still remember this number at the far end of the day; start
# earlier if that matters.
initial = "uniform"
initial_temperature_k = 298.8
forcing_file = "../forcing/concrete_day.csv"
# Every stored state is elementCount * layers * 8 bytes, and these scenes carry
# a few hundred thousand triangles, so the stride is what keeps a day's
# scrubbing inside a few hundred megabytes.
checkpoint_stride_h = 4.0
exchange_rays = 128
exchange_top_k = 16

# ============================================================================
# [thermography] -- what a camera would report, as <output>_tapp.exr
# ============================================================================
# The inverse of the render: given an assumed emissivity and an assumed
# reflected background, what temperature would a thermal camera read off each
# pixel? Where the assumption matches the surface it recovers the true
# temperature; where it does not -- the chrome sphere, the glass -- the error
# is the point.
[thermography]
enabled = true
emissivity = 0.93
# The sky this scene's forcing file gives at 14.0 h.
reflected_temperature_k = 293.5
