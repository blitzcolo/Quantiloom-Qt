# Onshore oilfield scene: a drilling rig, three pumpjacks, a tank battery and a lit flare.
#
# Site datum: origin at the rig floor centre. Pumpjacks march off to +X, the tank battery sits in
# its bund at -X, the flare stack is 95 m to -Y and the access road runs south from it.
#
# The flare is the reason to render this in LWIR as well as visible: its tip is a 1450 K source
# a hundred metres from a tank farm at 312 K, which is about the widest dynamic range this
# library has in one frame.

[renderer]
resolution = [1920, 1080]
spp = 160
seed = 17
output = "scene_oilfield_onshore.exr"
enable_shadow_rays = true

[spectral]
mode = "vis_fused"
lambda_min = 380
lambda_max = 2500
delta_lambda = 10
basis_file = "../spectral/quantiloom_basis_v3_usgs.qlbin"
materials_json = "../spectral/quantiloom_materials_usgs.json"
band = "VIS"

[scene]
gltf = "../models/blender/sites/oilfieldonshore.gltf"
world_units_to_meters = 1
default_temperature_k = 298

[[models]]
file = "../models/blender/vehicles/semitrailer.gltf"
name = "supply_truck"
translation = [-10, 0, -60]
rotation_euler_degrees = [0, 0, 0]

[[models]]
file = "../models/blender/vehicles/van.gltf"
name = "crew_van"
translation = [26, 0, 22]
rotation_euler_degrees = [0, 115, 0]

[[models]]
file = "../models/blender/industry/mixertruck.gltf"
name = "cement_truck"
translation = [-46, 0, -34]
rotation_euler_degrees = [0, 60, 0]

[[models]]
file = "../models/blender/organics/worker.gltf"
name = "roughneck"
translation = [7, 5.6, 6]
rotation_euler_degrees = [0, 200, 0]

[camera]
position = [150, 55, -150]
look_at = [0, 22, -10]
up = [0, 1, 0]
fov_y = 40

[lighting]
sun_direction = [0.30, 0.60, 0.74]
sun_radiance = [166, 146, 120]
sky_radiance = [16, 18, 25]
atmosphere_temperature_k = 298.15
solar_lut = "assets/luts/astmg173.csv"
solar_lut_columns = [4, 3]
solar_lut_diffuse_is_global = true

[atmosphere]
preset = "turbulent_clear"
vis_km = 22
t_ground_K = 301
rh = 35
p_hPa = 1011

[thermal]
time_h = 15.0
air_temperature_k = 298.15
sky_temperature_k = 263.0

[[materials]]
name = "Tank_White"
ir_emissivity = 0.88
thermal_conductivity_w_mk = 50
density_kg_m3 = 7800
specific_heat_j_kgk = 470
thickness_m = 0.008
convection_h_w_m2k = 14
shortwave_absorptivity = 0.30
interior_bc = "fixed"
interior_temperature_k = 312.0

[[materials]]
name = "Rig_Yellow"
ir_emissivity = 0.92
thermal_conductivity_w_mk = 45
density_kg_m3 = 7800
specific_heat_j_kgk = 480
thickness_m = 0.01
convection_h_w_m2k = 15
shortwave_absorptivity = 0.62

[[materials]]
name = "Insulation"
ir_emissivity = 0.35
thermal_conductivity_w_mk = 0.04
density_kg_m3 = 100
specific_heat_j_kgk = 900
thickness_m = 0.08
convection_h_w_m2k = 12
shortwave_absorptivity = 0.35
interior_bc = "fixed"
interior_temperature_k = 350.0
