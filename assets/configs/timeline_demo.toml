# ============================================================================
# A block drives across the ground, parks, and the ground remembers
# ============================================================================
# The scene the timeline was built for, in the form Studio can open with the
# assets this repo ships. Two models in one config: a flattened cube for the
# ground, and a second one that drives across it for four seconds and then
# stands still. Ten seconds of clock walk ten hours of sun.
#
# What to look at is the ground. A frozen geometry would say the block was
# always where it ends up, or never there at all; re-solving per frame would
# throw away the history. This solves once across piecewise-static geometry
# epochs, so the ground the block left goes on warming while the ground it
# parked on cools, with the transient in between.
#
# Open it, then drag the transport in the Timeline panel along the bottom.
# ============================================================================

[renderer]
resolution = [512, 512]
spp = 16
seed = 21628
output = "renders/timeline_demo.exr"

[spectral]
mode = "lwir_fused"
band = "LWIR"

[scene]
world_units_to_meters = 1.0
default_temperature_k = 300.0

# ----------------------------------------------------------------------------
# The clock
# ----------------------------------------------------------------------------
[timeline]
start_s = 0
end_s = "10s"
ticks_per_second = 20          # 201 ticks over the ten seconds

# One second of clock is one hour of sun. `thermal.time_h` below stops meaning
# "the hour to render" and starts meaning "the hour at start_s".
thermal_time_scale = 3600

thermal_geometry = "epochs"
# Both of these are deliberately coarser than their defaults, and the time
# scale above is why: one thermal timestep is 60 simulated seconds, which at
# 3600x is a sixtieth of a second of clock -- so the default stride would offer
# six hundred candidate boundaries over this timeline. What decides how many
# survive is the minimum move, and two metres is about the scale at which the
# shadow under a block this size lands somewhere new.
thermal_epoch_stride_s = 0.5
thermal_epoch_min_move_m = 2.0

# ----------------------------------------------------------------------------
# The models
# ----------------------------------------------------------------------------
[[models]]
file = "../models/cube.glb"
name = "ground"
translation = [0.0, -1.0, 0.0]
scale = [20.0, 0.2, 20.0]

[[models]]
file = "../models/cube.glb"
name = "block"
scale = [1.5, 1.5, 1.5]

# Form one of three: keyframes. Two of them, linearly interpolated, and the
# range ends at four seconds -- `extrapolate = "hold"` is the default, so after
# that the block simply stands where it stopped. Which is the point of the
# scene.
[models.motion]
interpolation = "linear"
extrapolate = "hold"

[[models.motion.keys]]
t = 0
position = [-8.0, 0.0, 0.0]

[[models.motion.keys]]
t = "4s"
position = [0.0, 0.0, 0.0]

# The other two forms, for reference. A piecewise expression in `t` (global
# seconds) and `s` (seconds into the segment):
#
#   [[models.motion.segments]]
#   from = 4
#   to = 10
#   position = ["2*s", "0", "0.3*sin(3*s)"]
#
# ...or a parametric engine:
#
#   [models.motion.location]
#   type = "linear"
#   heading_deg = 90
#   speed_m_s = 2.0
#   [models.motion.orientation]
#   type = "along_velocity"

[camera]
position = [-6.0, 6.0, 9.0]
look_at = [0.0, 0.5, 0.0]
up = [0.0, 1.0, 0.0]
fov_y = 45.0

[lighting]
# Owned by the forcing CSV for the solve; kept roughly consistent with the
# hours this timeline covers so the shading and the temperatures agree about
# where the sun is.
sun_direction = [-0.6857, 0.7232, 0.0819]
sun_radiance = [0.0, 0.0, 0.0]
sky_radiance = [0.0, 0.0, 0.0]
atmosphere_temperature_k = 313.0

[material]
albedo = [0.5, 0.5, 0.5]

[atmosphere]
preset = "disabled"
sky_model = "clear_sky"
air_temperature_k = 313.0
relative_humidity = 20.0

[thermal]
enabled = true
# The hour at the timeline's START, because [timeline] drives the rest. Day 4
# at 04:00, with three days of spin-up behind it; ten seconds of clock takes it
# to 14:00.
time_h = 76.0
start_time_h = 0.0
timestep_s = 60.0
layers = 10
initial = "steady"
checkpoint_stride_h = 6.0
forcing_file = "../forcing/desert_day.csv"
exchange_rays = 128
exchange_top_k = 16

# Both models are the same file, so both bring a material called "Material".
# Merging keeps the first one's bare name and prefixes the second with its
# model's -- so the block's is "block/Material". A material named in only one
# of these blocks would leave half the scene out of the thermal solve, which
# the log says plainly ("N materials have no measured spectrum...").
[[materials]]
name = "Material"
thermal_conductivity_w_mk = 0.30
density_kg_m3 = 1600.0
specific_heat_j_kgk = 800.0
thickness_m = 0.15
convection_h_w_m2k = 14.0
shortwave_absorptivity = 0.72
ir_emissivity = 0.90
interior_bc = "adiabatic"

[[materials]]
name = "block/Material"
thermal_conductivity_w_mk = 45.0
density_kg_m3 = 7800.0
specific_heat_j_kgk = 460.0
thickness_m = 0.004
convection_h_w_m2k = 20.0
shortwave_absorptivity = 0.60
ir_emissivity = 0.85
interior_bc = "adiabatic"

[thermography]
enabled = false

[sensor]
enabled = false
